<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>md2img — Markdown 转图片</title>
<meta name="description" content="将 Markdown 文本导出为精美图片，支持多主题、多字体、多尺寸，离线可用。">
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" id="meta-theme-color" content="#f8f9fa">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="md2img">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='36' fill='%234f46e5'/><text x='96' y='118' text-anchor='middle' font-size='56' fill='white' font-family='sans-serif' font-weight='bold'>M↓</text></svg>">
<!-- CDN libraries -->
<script src="https://cdn.jsdelivr.net/npm/marked@11.2.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-theme="light">

<!-- ═══════════ top bar ═══════════ -->
<header class="topbar">
  <button id="btn-menu" class="menu-btn" aria-label="打开设置菜单">☰</button>
  <div class="brand">md2img <span class="brand-sub">Markdown → 图片</span></div>
  <div class="top-actions">
    <button id="btn-copy-mobile" class="icon-btn mobile-only" title="复制图片到剪贴板">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </button>
    <button id="btn-download-mobile" class="primary mobile-only" title="下载图片 (Ctrl+Enter)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
    <button id="btn-copy" class="icon-btn desktop-only" title="复制图片到剪贴板 (Ctrl+Shift+C)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </button>
    <button id="btn-download" class="primary desktop-only" title="下载图片 (Ctrl+Enter)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      下载
    </button>
  </div>
</header>

<!-- ═══════════ layout ═══════════ -->
<div class="layout">
  <!-- sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-tabs" role="tablist">
      <button class="active" data-tab="tab-appearance">外观</button>
      <button data-tab="tab-font">字体</button>
      <button data-tab="tab-layout">排版</button>
      <button data-tab="tab-export">导出</button>
    </div>
    <div class="sidebar-body">
      <button class="drawer-close mobile-only" aria-label="关闭菜单">✕</button>

      <!-- 外观 -->
      <section class="tab-panel active" id="tab-appearance">
        <h4 class="panel-title">背景主题</h4>
        <div class="chip-grid" id="theme-chips">
          <button class="chip theme-chip active" data-theme="light">☀️ 亮色</button>
          <button class="chip theme-chip" data-theme="dark">🌙 暗色</button>
          <button class="chip theme-chip" data-theme="warm">🕯️ 暖色</button>
          <button class="chip theme-chip" data-theme="green">🌿 护眼绿</button>
        </div>
        <p class="panel-hint">预览卡片与界面同步换肤</p>
      </section>

      <!-- 字体 -->
      <section class="tab-panel" id="tab-font">
        <h4 class="panel-title">预览字体</h4>
        <div class="chip-grid" id="font-chips">
          <button class="chip font-chip active" data-font="hei">黑体 · 清晰现代</button>
          <button class="chip font-chip" data-font="serif">衬线 · 古典优雅</button>
          <button class="chip font-chip" data-font="mono">等宽 · 极客代码</button>
          <button class="chip font-chip" data-font="round">圆体 · 温润可爱</button>
        </div>
        <p class="panel-hint">字体随用户设备自动回退</p>
      </section>

      <!-- 排版 -->
      <section class="tab-panel" id="tab-layout">
        <h4 class="panel-title">输出宽度</h4>
        <div class="chip-grid" id="width-chips">
          <button class="chip layout-chip" data-width="600">600px · 手机分享</button>
          <button class="chip layout-chip active" data-width="780">780px · 图文混排</button>
          <button class="chip layout-chip" data-width="960">960px · 宽屏阅读</button>
          <button class="chip layout-chip" data-width="1200">1200px · 长图导出</button>
        </div>
        <h4 class="panel-title">正文字号</h4>
        <div class="chip-grid" id="fontsize-chips">
          <button class="chip layout-chip" data-size="14">14px · 紧凑</button>
          <button class="chip layout-chip active" data-size="16">16px · 标准</button>
          <button class="chip layout-chip" data-size="18">18px · 易读</button>
          <button class="chip layout-chip" data-size="20">20px · 大字</button>
        </div>
        <h4 class="panel-title">内边距</h4>
        <div class="chip-grid" id="padding-chips">
          <button class="chip layout-chip" data-padding="20">20px · 紧凑</button>
          <button class="chip layout-chip active" data-padding="32">32px · 标准</button>
          <button class="chip layout-chip" data-padding="48">48px · 宽松</button>
          <button class="chip layout-chip" data-padding="64">64px · 海报</button>
        </div>
      </section>

      <!-- 导出 -->
      <section class="tab-panel" id="tab-export">
        <h4 class="panel-title">图片格式</h4>
        <div class="chip-grid" id="export-format">
          <button class="chip export-format active" data-format="png">PNG · 无损</button>
          <button class="chip export-format" data-format="jpeg">JPEG · 体积小</button>
        </div>
        <h4 class="panel-title">清晰度</h4>
        <div class="chip-grid" id="export-scale">
          <button class="chip export-scale" data-scale="1">1x · 标准</button>
          <button class="chip export-scale active" data-scale="2">2x · 高清</button>
          <button class="chip export-scale" data-scale="3">3x · 超清</button>
        </div>
        <h4 class="panel-title" id="quality-label">JPEG 质量</h4>
        <div class="quality-row">
          <input type="range" id="slider-quality" min="50" max="100" step="1" value="90" aria-label="JPEG 质量">
          <span id="val-quality">90%</span>
        </div>
      </section>

      <div class="sidebar-footer">
        <button id="btn-clear" class="ghost-btn">🗑️ 清空内容</button>
        <button id="btn-sample" class="ghost-btn">✨ 加载示例</button>
        <button id="btn-reset" class="ghost-btn">♻️ 清除缓存</button>
      </div>
    </div>
  </aside>
  <div class="drawer-overlay" id="drawer-overlay"></div>

  <!-- workbench -->
  <main class="workbench">
    <section class="pane editor-pane">
      <div class="pane-header">
        <span class="pane-title">Markdown</span>
        <span class="pane-stats" id="editor-stats">0 字符</span>
      </div>
      <textarea id="editor" class="editor" spellcheck="false"
        placeholder="# 在这里输入 Markdown&#10;&#10;右侧实时预览，Ctrl+Enter 一键导出图片"></textarea>
    </section>
    <section class="pane preview-pane">
      <div class="pane-header">
        <span class="pane-title">预览</span>
        <span class="pane-stats" id="preview-stats">—</span>
      </div>
      <div class="preview-wrap" id="preview-wrap">
        <article id="preview" class="preview-card" aria-label="预览卡片"></article>
      </div>
    </section>
  </main>
</div>

<!-- toast -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/utils.js"></script>
<script src="js/renderer.js"></script>
<script src="js/exporter.js"></script>
<script src="js/app.js"></script>
</body>
</html>
